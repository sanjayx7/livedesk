<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="tis-bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A72C6" />
      <stop offset="100%" stop-color="#07518F" />
    </linearGradient>
    <filter id="tis-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0A72C6" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#tis-bg-gradient)" />
  <!-- Inner Subtle Accent Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="8" />
  <!-- Text TIS -->
  <text x="50%" y="54%" 
        font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="210" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        dominant-baseline="central" 
        letter-spacing="-3"
        filter="url(#tis-shadow)">TIS</text>
</svg>
